<div>
    <p class="recovery-intro">Please enter the email you used to register your account to generate a recovery token, and ask Matt for the token</p>
    <form hx-post="/recovery/token/generate" hx-target="#token-generation-feedback-row" hx-swap="innerHTML">
        <div class="form-field">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" placeholder="Email" required>
        </div>
        <button type="submit">Generate Token</button>
        <div id="token-generation-feedback-row" class="form-feedback">
            <!-- Success/error messages will appear here -->
        </div>
    </form>

    <form hx-post="/recovery" hx-target="#reset-feedback-row" hx-swap="innerHTML" style="margin-top: 16px;">
        <div class="form-field">
            <label for="token">Recovery Token</label>
            <input id="token" name="token" placeholder="Paste your token from Matt here" required>
        </div>

        <div class="form-field">
            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" name="newPassword" placeholder="New Password" required>
        </div>

        <div class="form-field">
            <label for="confirmPassword">Password Confirmation</label>
            <input id="confirmPassword" type="password" name="confirmPassword" placeholder="Confirm Password" required>
        </div>

        <button type="submit">Reset Password</button>
        <div id="reset-feedback-row" class="form-feedback">
            <!-- Success/error messages will appear here -->
        </div>
    </form>
</div>

<button id="registration-tab"
        class="tab"
        hx-get="/components/registration.html"
        hx-target="#content-area"
        hx-swap="innerHTML"
        hx-swap-oob="outerHTML">
    Account Registration
</button>

<button id="recovery-tab"
        class="tab active"
        hx-get="/components/accountRecovery.html"
        hx-target="#content-area"
        hx-swap="innerHTML"
        hx-swap-oob="outerHTML">
    Account Recovery
</button>
